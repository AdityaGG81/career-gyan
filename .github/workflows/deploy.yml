name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM and Build Assets
        run: |
          npm ci
          npm run build

      - name: Sync Files to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_USERNAME }}
          TARGET: "/home/jenmwcvm/repositories/career-gyan/"
          EXCLUDE: "/.git/, /node_modules/, /vendor/, /.env, /tests/"

      - name: Execute Server Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: 22
          script: |
            cd /home/jenmwcvm/repositories/career-gyan
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            cp -R public/* /home/jenmwcvm/public_html/
