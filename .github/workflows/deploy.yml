name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM and Build Assets
        run: |
          npm ci
          npm run build

      - name: Sync App Files to Repository
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: repositories/career-gyan/
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            vendor/**
            public/**
            .env
            tests/**
            database/*.sqlite
            database/**/*.sqlite

      - name: Sync Public Files to Public_HTML
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: ./public/
          protocol: ftp
          exclude: |
            index.php
            .htaccess
            **/.git*
            **/.git*/**

      - name: Clear Laravel Caches
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            cd ~/repositories/career-gyan
            php artisan optimize:clear || true
            php artisan view:clear || true
            php artisan config:clear || true
            php artisan cache:clear || true
