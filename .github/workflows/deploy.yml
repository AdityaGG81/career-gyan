name: Deploy via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM and Build Assets
        run: |
          npm ci
          npm run build

      - name: Create Deployment ZIP
        run: |
          zip -r release.zip . -x "*.git*" "node_modules/*" "tests/*"

      - name: Transfer ZIP to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "release.zip"
          target: "/home/jenmwcvm/repositories/career-gyan"

      - name: Extract and Execute Server Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            cd /home/jenmwcvm/repositories/career-gyan
            unzip -o release.zip
            rm release.zip
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            cp -R public/* /home/jenmwcvm/public_html/
