name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM and Build Assets
        run: |
          npm ci
          npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install lftp -y

      - name: Sync App Files to Repositories
        env:
          FTP_HOST: ${{ secrets.CPANEL_HOST }}
          FTP_USER: ${{ secrets.CPANEL_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 10;
            open -u $FTP_USER,$FTP_PASS $FTP_HOST;
            mirror -R -X .git/ -X node_modules/ -X vendor/ -X public/ -X tests/ -X .env ./ repositories/career-gyan/;
            quit
          "

      - name: Sync Public Files to Public_HTML
        env:
          FTP_HOST: ${{ secrets.CPANEL_HOST }}
          FTP_USER: ${{ secrets.CPANEL_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 10;
            open -u $FTP_USER,$FTP_PASS $FTP_HOST;
            mirror -R -X .git/ -X index.php -X .htaccess ./public/ public_html/;
            quit
          "
