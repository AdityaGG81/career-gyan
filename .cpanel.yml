---
deployment:
  tasks:
    # Install/update Composer dependencies (no dev packages in production)
    - export COMPOSER_HOME="${HOME}/.config/composer" && php composer.phar install --no-dev --optimize-autoloader --no-interaction

    # Run database migrations
    - export HOME=/home/$USER && php artisan migrate --force

    # Clear all Laravel caches
    - php artisan config:clear
    - php artisan cache:clear
    - php artisan route:clear
    - php artisan view:clear

    # Re-cache for production performance
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - php artisan optimize

    # Fix storage permissions
    - chmod -R 755 storage
    - chmod -R 755 bootstrap/cache
